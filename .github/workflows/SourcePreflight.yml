name: Temporary docs source preflight (no deployment)

on:
  workflow_dispatch:
  push:
    branches: [codex/vpldocs-source-preflight]

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: VPLDocs
    env:
      VPL_CANDIDATE: 39d8dd628c28d49ac93e7da3a265ecbf8b8541e2
      PB_CANDIDATE: 12b0c1976a0177985437056c5fb01415c3e53e2e
      JULIA_PKG_PRECOMPILE_AUTO: "0"
    steps:
      - uses: actions/checkout@v6
        with:
          path: VPLDocs
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: VEZY/PlantBiophysics.jl
          ref: ${{ env.PB_CANDIDATE }}
          path: PlantBiophysics
          persist-credentials: false
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - uses: julia-actions/cache@v2
      - name: Resolve source preflight environment
        timeout-minutes: 25
        run: |
          mkdir -p "$RUNNER_TEMP/vpldocs-preflight"
          julia --project=docs -e '
            using Pkg
            Pkg.develop([PackageSpec(path=pwd()), PackageSpec(path=joinpath(dirname(pwd()), "PlantBiophysics"))])
            Pkg.add([PackageSpec(name="PlantSimEngine", version=v"0.15.0"), PackageSpec(name="PlantGeom", version=v"0.20.0")])
            Pkg.instantiate()' 2>&1 | tee "$RUNNER_TEMP/vpldocs-preflight/resolve.log"
      - name: Record exact sources and resolved environment
        timeout-minutes: 5
        run: |
          git diff --exit-code "$VPL_CANDIDATE" -- docs/src docs/make.jl src
          julia --project=docs docs/source_preflight.jl environment "$RUNNER_TEMP/vpldocs-preflight"
      - name: Build unchanged documentation without deployment
        timeout-minutes: 25
        env:
          CI: "true"
        run: |
          julia --project=docs docs/source_preflight.jl build "$RUNNER_TEMP/vpldocs-preflight" 2>&1 | tee "$RUNNER_TEMP/vpldocs-preflight/build.log"
          test -s docs/build/index.html
          test -s docs/build/VPLVerse/PlantBioPhysics/API/index.html
          test -s docs/build/VPLVerse/PlantSimEngine/API/index.html
      - name: Verify preserved documentation source
        if: ${{ always() }}
        timeout-minutes: 2
        run: git diff --exit-code "$VPL_CANDIDATE" -- docs/src docs/make.jl src
      - name: Retain source preflight evidence (not registry acceptance)
        if: ${{ always() }}
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: vpldocs-source-preflight-${{ github.sha }}
          path: |
            ${{ runner.temp }}/vpldocs-preflight
            VPLDocs/docs/build
          if-no-files-found: error
          retention-days: 30
